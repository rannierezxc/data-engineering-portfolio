[project]
name = "data-engineering-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ranniereramirez", email = "ranniereramirez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
]

[project.scripts]
data-engineering-portfolio = "data_engineering_portfolio:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "responses>=0.26.3",
    "ruff>=0.17.4",
    "types-requests>=2.33.0.20261030",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict= true
exclude = ["tests/"]


[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
